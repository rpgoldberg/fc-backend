---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fc-backend
  namespace: figurecollecting
  labels:
    app: fc-backend
    app.kubernetes.io/name: fc-backend
    app.kubernetes.io/part-of: figure-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fc-backend
  template:
    metadata:
      labels:
        app: fc-backend
        app.kubernetes.io/name: fc-backend
        app.kubernetes.io/part-of: figure-collector
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fc-backend
          image: ghcr.io/figurecollecting/fc-backend:develop
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5050
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fc-backend-config
            - secretRef:
                name: fc-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 5050
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: app-logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app-data
          emptyDir: {}
        - name: app-logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
